<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">✓</span>
        <h1>TaskFlow</h1>
      </div>
      <p class="subtitle">Stay organized and get things done</p>
    </header>

    <!-- Task Input Form -->
    <form id="todo-form" class="task-form">
      <div class="input-group">
        <input 
          type="text" 
          id="task-input" 
          placeholder="What needs to be done?" 
          autocomplete="off"
          aria-label="New task description"
        >
        <button type="submit" id="add-btn" class="btn-primary">Add Task</button>
      </div>
    </form>

    <!-- Stats and Filter Bar -->
    <section class="task-controls">
      <!-- Task Stats -->
      <div class="task-stats">
        <span class="stat-badge">Total: <strong id="total-count">0</strong></span>
        <span class="stat-badge">Completed: <strong id="completed-count">0</strong></span>
      </div>

      <!-- Filters -->
      <div class="filters" role="tablist">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </section>

    <!-- Task List Area -->
    <main class="tasks-wrapper">
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>

      <!-- Friendly Empty State -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📝</div>
        <h3>No tasks yet</h3>
        <p>Add your first task above to kickstart your productivity!</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
